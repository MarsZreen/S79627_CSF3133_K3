<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors</title>
    <!-- Link external stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header Section -->
    <header>
        <h1>Rock, Paper, Scissors</h1>
        <p>Enter your name, click Start Game, then choose Rock, Paper, or Scissors.</p>
    </header>

    <!-- Player Setup Section -->
    <section class="panel">
        <label for="playerName">Your name:</label>
        <input type="text" id="playerName" placeholder="Enter your name">
        <button type="button" onclick="startGame()">Start Game</button>
        <p id="welcomeMsg"></p>
    </section>

    <!-- Game Controls & Choice Images Section -->
    <section class="panel">
        <div class="choices">
            <button type="button" onclick="playRound('rock')">Rock</button>
            <button type="button" onclick="playRound('paper')">Paper</button>
            <button type="button" onclick="playRound('scissors')">Scissors</button>
        </div>

        <div class="arena">
            <div class="player-box">
                <h3>You</h3>
                <img id="playerImg" src="rock.jpg" alt="Your Choice">
            </div>
            <div class="vs-label">VS</div>
            <div class="player-box">
                <h3>Computer</h3>
                <img id="computerImg" src="rock.jpg" alt="Computer Choice">
            </div>
        </div>
    </section>

    <!-- Result & Scoreboard Section -->
    <section class="panel">
        <p id="result">No round played yet.</p>
        <p class="scoreboard">
            Wins: <span id="wins">0</span> |
            Losses: <span id="losses">0</span> |
            Draws: <span id="draws">0</span>
        </p>
    </section>

    <!-- Round History & Summary/Reset Section -->
    <section class="panel">
        <h2>History</h2>
        <table id="history">
            <thead>
                <tr>
                    <th>Round</th>
                    <th>You</th>
                    <th>Computer</th>
                    <th>Result</th>
                </tr>
            </thead>
            <tbody id="historyBody"></tbody>
        </table>

        <div class="actions">
            <button type="button" onclick="showSummary()">Show Summary</button>
            <button type="button" onclick="resetGame()">Reset</button>
        </div>
        <p id="summaryText"></p>
    </section>

    <!-- Footer Section -->
    <footer>
        <p id="startTime"></p>
        <p>&copy; 2026 Computer Science Club</p>
    </footer>

    <!-- Link external JavaScript file -->
    <script src="game.js"></script>
</body>
</html>
